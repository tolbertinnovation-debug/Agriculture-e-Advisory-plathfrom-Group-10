name: CI

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test

  api-tests-postgres:
    # The same tests again, on a real PostgreSQL 16 (every test gets its own schema).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agriconnect_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/agriconnect_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t agriconnect:ci .
      - name: Start it and wait until it is ready
        run: |
          docker run -d --name agriconnect -p 3000:3000 -e WEATHER=off agriconnect:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ready; then echo; echo "ready"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ready
          docker exec agriconnect id -u | grep -qv '^0$'   # must not run as root
      - name: Show logs
        if: always()
        run: docker logs agriconnect || true
